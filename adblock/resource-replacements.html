<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request Blocking Test</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    td, th { border: 1px solid #ccc; padding: 6px; vertical-align: top; text-align: left; }
    .pass { background: #d4f8d4; }
    .fail { background: #f8d4d4; }
    pre { white-space: pre-wrap; word-break: break-all; margin: 0; }
    button { font-size: 16px; padding: 8px 16px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Request Blocking Test</h1>
  <p>Requires <code>filters.txt</code> as a custom filter list and Shields on.</p>
  <button id="run">Run tests</button>
  <table>
    <thead><tr><th>Test</th><th>Expected</th><th>Result</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
  <script src="resource-replacements.js"></script>
</body>
</html>
